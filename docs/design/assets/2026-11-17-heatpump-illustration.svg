<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .value { font-size: 15px; font-weight: 600; fill: #212121; }
    .small { font-size: 13px; font-weight: 600; fill: #212121; }
    .label { font-size: 11px; fill: #6b6b6b; }
    .housing { fill: #eceff1; stroke: #90a4ae; stroke-width: 2; }
    .pipe { fill: none; stroke: #90a4ae; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 14; animation: flow 1.2s linear infinite; }
    .cold { stroke: #42a5f5; }
    .warm { stroke: #ff8a65; }
    .air { fill: none; stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
    .rpipe { fill: none; stroke: #cfd8dc; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .rflow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 8; animation: flow 0.9s linear infinite; }
    .hotgas { stroke: #e53935; }
    .liquid { stroke: #fb8c00; }
    .suction { stroke: #7e57c2; }
    .fan { transform-origin: 274px 132px; animation: spin 0.9s linear infinite; }
    .piston { animation: pump 0.6s ease-in-out infinite; }
    .hx { fill: #fff3e0; stroke: #fb8c00; stroke-width: 2; }
    .coil { fill: none; stroke: #e53935; stroke-width: 3; stroke-linejoin: round; }
    .pump-running .pumpbody { fill: #e8f5e9; stroke: #43a047; stroke-width: 2.5; }
    .pump-running .pumptri { fill: #43a047; }
    .badge { fill: #1e88e5; }
    .cord { fill: none; stroke: #424242; stroke-width: 3; stroke-linecap: round; }
    .wave { animation: wave 8s linear infinite reverse; }
    .wave2 { animation: wave 12s linear infinite; }
    @keyframes wave { from { transform: translateX(0); } to { transform: translateX(80px); } }  /* one full wave (crest + trough) */
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .flow, .air, .fan, .piston, .rflow, .wave, .wave2 { animation: none; } }
  </style>
  <rect class="bg" width="640" height="480" rx="12"/>

  <!-- air flow through the unit -->
  <path class="air" d="M40 122 H160"/>
  <path class="air" d="M40 142 H160"/>
  <polygon points="160,116 172,132 160,148" fill="#b0bec5"/>
  <text x="40" y="104" class="label">air in</text>
  <text x="40" y="170" class="value">10.0 °C</text>
  <path class="air" d="M472 122 H600"/>
  <path class="air" d="M472 142 H600"/>
  <polygon points="600,116 612,132 600,148" fill="#b0bec5"/>
  <text x="520" y="104" class="label">air out</text>
  <text x="520" y="170" class="value">6.0 °C</text>

  <!-- legend of the refrigerant lines -->
  <g transform="translate(40 210)" font-size="10" fill="#6b6b6b">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#e53935" stroke-width="3"/><text x="24" y="4">hot gas</text>
    <line x1="0" y1="16" x2="18" y2="16" stroke="#fb8c00" stroke-width="3"/><text x="24" y="20">liquid</text>
    <line x1="0" y1="32" x2="18" y2="32" stroke="#7e57c2" stroke-width="3"/><text x="24" y="36">suction gas</text>
  </g>

  <!-- heat pump housing -->
  <rect class="housing" x="176" y="40" width="288" height="240" rx="14"/>
  <text x="192" y="58" class="label">HEAT PUMP</text>
  <rect class="badge" x="398" y="48" width="54" height="22" rx="11"/>
  <text x="425" y="64" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LOW</text>

  <!-- heat exchanger (condenser): the refrigerant coil gives its heat to the water flowing through -->
  <rect class="hx" x="252" y="196" width="136" height="48" rx="8"/>
  <polyline class="coil" points="366,206 350,230 334,206 318,230 302,206 286,230 274,206"/>
  <text x="320" y="190" class="label" text-anchor="middle">heat exchanger</text>
  <text x="320" y="258" class="label" text-anchor="middle">thermal</text>
  <text x="320" y="274" class="small" text-anchor="middle">2.85 kW</text>

  <!-- refrigerant circuit: compressor -> hot gas -> condenser -> liquid -> expansion valve -> evaporator -> suction gas -> compressor -->
  <path class="rpipe" d="M196 86 V74 H378 V86"/>
  <path class="rflow suction" d="M196 86 V74 H378 V86"/>
  <path class="rpipe" d="M404 122 H420 V206 H366"/>
  <path class="rflow hotgas" d="M404 122 H420 V206 H366"/>
  <path class="rpipe" d="M274 206 H262 V188 H196 V178"/>
  <path class="rflow liquid" d="M274 206 H262 V188 H196 V178"/>
  <g transform="translate(228 188)">
    <polygon points="-9,-7 -9,7 0,0" fill="#fb8c00"/>
    <polygon points="9,-7 9,7 0,0" fill="#fb8c00"/>
  </g>
  <!-- refrigerant temperatures -->
  <text x="424" y="150" class="label" fill="#c62828">gas</text>
  <text x="424" y="166" font-size="12" font-weight="600" fill="#c62828">52 °C</text>
  <text x="246" y="208" class="label" fill="#e65100" text-anchor="end">liquid</text>
  <text x="246" y="223" class="small" fill="#e65100" text-anchor="end">17 °C</text>

  <!-- evaporator -->
  <rect x="188" y="86" width="16" height="92" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <path d="M188 98 H204 M188 110 H204 M188 122 H204 M188 134 H204 M188 146 H204 M188 158 H204 M188 170 H204" stroke="#b39ddb" stroke-width="1.5"/>
  <text transform="translate(214 132) rotate(-90)" font-size="10" fill="#6b6b6b" text-anchor="middle">evaporator</text>

  <!-- fan -->
  <circle cx="274" cy="132" r="48" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <g class="fan">
    <path d="M274 132 C274 104 291 89 304 95 C298 112 285 123 274 132 Z" fill="#78909c"/>
    <path d="M274 132 C302 132 317 149 311 162 C294 156 283 143 274 132 Z" fill="#78909c"/>
    <path d="M274 132 C274 160 257 175 244 169 C250 152 263 141 274 132 Z" fill="#78909c"/>
    <path d="M274 132 C246 132 231 115 237 102 C254 108 265 121 274 132 Z" fill="#78909c"/>
    <circle cx="274" cy="132" r="7" fill="#546e7a"/>
  </g>

  <!-- compressor with a pumping piston -->
  <rect x="352" y="86" width="52" height="72" rx="10" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <rect x="363" y="98" width="30" height="48" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.5"/>
  <g class="piston">
    <rect x="365" y="126" width="26" height="10" rx="2" fill="#fb8c00"/>
    <rect x="375" y="136" width="6" height="12" fill="#ef6c00"/>
  </g>
  <text x="378" y="172" class="label" text-anchor="middle">compressor</text>

  <!-- power cord to a wall socket, with the electrical power -->
  <path class="cord" d="M464 250 C496 250 512 272 548 270"/>
  <rect x="546" y="262" width="16" height="16" rx="3" fill="#616161"/>
  <rect x="562" y="266" width="6" height="2.5" fill="#9e9e9e"/>
  <rect x="562" y="271.5" width="6" height="2.5" fill="#9e9e9e"/>
  <rect x="570" y="248" width="44" height="44" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="592" cy="270" r="13" fill="#eeeeee" stroke="#bdbdbd" stroke-width="1.5"/>
  <circle cx="586" cy="270" r="2.5" fill="#616161"/>
  <circle cx="598" cy="270" r="2.5" fill="#616161"/>
  <text x="592" y="308" class="label" text-anchor="middle">electrical</text>
  <text x="592" y="324" class="value" text-anchor="middle">386 W</text>

  <!-- supply: pond -> pump -> water in -> heat exchanger -->
  <path class="pipe" d="M100 380 V312 H230 V236 H252"/>
  <path class="flow cold" d="M100 380 V312 H230 V236 H252"/>
  <!-- return: heat exchanger -> water out -> pond -->
  <path class="pipe" d="M388 236 H410 V312 H540 V380"/>
  <path class="flow warm" d="M388 236 H410 V312 H540 V380"/>
  <polygon points="533,366 547,366 540,380" fill="#ff8a65"/>

  <text x="242" y="300" class="label">water in</text>
  <text x="242" y="318" class="value">14.0 °C</text>
  <text x="398" y="300" class="label" text-anchor="end">water out</text>
  <text x="398" y="318" class="value" text-anchor="end">16.0 °C</text>

  <!-- circulation pump -->
  <g class="pump-running" transform="translate(160 312)">
    <circle class="pumpbody" r="20"/>
    <polygon class="pumptri" points="-11,-15 -11,15 17,0"/>
  </g>
  <text x="160" y="348" class="label" text-anchor="middle">pump · running</text>
  <text x="160" y="364" font-size="13" font-weight="600" fill="#212121" text-anchor="middle">43 % · 103 W</text>

  <!-- pond -->
  <path d="M60 380 H580 V450 Q580 460 570 460 H70 Q60 460 60 450 Z" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <clipPath id="tub"><path d="M61 381 H579 V450 Q579 459 570 459 H70 Q61 459 61 450 Z"/></clipPath>
  <g clip-path="url(#tub)">
    <path class="wave" d="M-98 394 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V458 H-98 Z" fill="#90caf9" opacity=".8"/>
    <path class="wave2" d="M-98 400 q20 5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V458 H-98 Z" fill="#64b5f6" opacity=".25"/>
  </g>
  <text x="320" y="438" class="label" text-anchor="middle">pond</text>
  <text x="320" y="422" font-size="22" font-weight="700" fill="#0d47a1" text-anchor="middle">14.6 °C</text>
</svg>

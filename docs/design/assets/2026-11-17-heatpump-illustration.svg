<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .value { font-size: 15px; font-weight: 600; fill: #212121; }
    .small { font-size: 13px; font-weight: 600; fill: #212121; }
    .label { font-size: 11px; fill: #6b6b6b; }
    .housing { fill: #eceff1; stroke: #90a4ae; stroke-width: 2; }
    .pipe { fill: none; stroke: #90a4ae; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 14; animation: flow 1.2s linear infinite; }
    .cold { stroke: #42a5f5; }
    .warm { stroke: #ff8a65; }
    .air { fill: none; stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
    /* refrigerant circuit */
    .rpipe { fill: none; stroke: #cfd8dc; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .rflow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 8; animation: flow 0.9s linear infinite; }
    .hotgas { stroke: #e53935; }
    .liquid { stroke: #fb8c00; }
    .suction { stroke: #7e57c2; }
    .fan { transform-origin: 262px 128px; animation: spin 0.9s linear infinite; }
    .piston { animation: pump 0.6s ease-in-out infinite; }
    .hx { fill: #fff3e0; stroke: #fb8c00; stroke-width: 2; }
    .coil { fill: none; stroke: #e53935; stroke-width: 3; stroke-linejoin: round; }
    .pump-running .pumpbody { fill: #e8f5e9; stroke: #43a047; stroke-width: 2.5; }
    .pump-running .pumptri { fill: #43a047; }
    .badge { fill: #1e88e5; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .flow, .air, .fan, .piston, .rflow { animation: none; } }
  </style>
  <rect class="bg" width="640" height="480" rx="12"/>

  <!-- air flow through the unit -->
  <path class="air" d="M40 118 H160"/>
  <path class="air" d="M40 138 H160"/>
  <polygon points="160,112 172,128 160,144" fill="#b0bec5"/>
  <text x="40" y="100" class="label">air in</text>
  <text x="40" y="166" class="value">10.0 °C</text>
  <path class="air" d="M472 118 H600"/>
  <path class="air" d="M472 138 H600"/>
  <polygon points="600,112 612,128 600,144" fill="#b0bec5"/>
  <text x="520" y="100" class="label">air out</text>
  <text x="520" y="166" class="value">6.0 °C</text>

  <!-- heat pump housing -->
  <rect class="housing" x="176" y="40" width="288" height="240" rx="14"/>
  <text x="192" y="58" class="label">HEAT PUMP</text>

  <!-- heat exchanger (condenser): the refrigerant coil gives its heat to the water flowing through -->
  <rect class="hx" x="252" y="196" width="136" height="48" rx="8"/>
  <polyline class="coil" points="366,206 350,230 334,206 318,230 302,206 286,230 274,206"/>
  <text x="320" y="258" class="label" text-anchor="middle">heat exchanger</text>
  <text x="320" y="274" class="small" text-anchor="middle">17.0 °C</text>

  <!-- refrigerant circuit: compressor -> hot gas -> condenser (heat exchanger) -> liquid -> expansion valve -> evaporator -> suction gas -> compressor -->
  <!-- suction gas: evaporator top -> compressor top -->
  <path class="rpipe" d="M196 82 V70 H342 V84"/>
  <path class="rflow suction" d="M196 82 V70 H342 V84"/>
  <!-- hot gas: compressor side -> condenser (enters at the right) -->
  <path class="rpipe" d="M366 120 H380 V206 H366"/>
  <path class="rflow hotgas" d="M366 120 H380 V206 H366"/>
  <!-- liquid: condenser (leaves at the left) -> expansion valve -> evaporator bottom -->
  <path class="rpipe" d="M274 206 H264 V184 H196 V174"/>
  <path class="rflow liquid" d="M274 206 H264 V184 H196 V174"/>
  <!-- expansion valve symbol (two triangles tip to tip) -->
  <g transform="translate(228 184)">
    <polygon points="-9,-7 -9,7 0,0" fill="#fb8c00"/>
    <polygon points="9,-7 9,7 0,0" fill="#fb8c00"/>
  </g>

  <!-- evaporator: finned coil the air flows through, in front of the fan -->
  <rect x="188" y="82" width="16" height="92" rx="3" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <path d="M188 94 H204 M188 106 H204 M188 118 H204 M188 130 H204 M188 142 H204 M188 154 H204 M188 166 H204" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="196" y="198" class="label" text-anchor="middle">evap.</text>

  <!-- fan -->
  <circle cx="262" cy="128" r="42" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <g class="fan">
    <path d="M262 128 C262 103 277 90 288 95 C283 110 271 120 262 128 Z" fill="#78909c"/>
    <path d="M262 128 C287 128 300 143 295 154 C280 149 270 137 262 128 Z" fill="#78909c"/>
    <path d="M262 128 C262 153 247 166 236 161 C241 146 253 136 262 128 Z" fill="#78909c"/>
    <path d="M262 128 C237 128 224 113 229 102 C244 107 254 119 262 128 Z" fill="#78909c"/>
    <circle cx="262" cy="128" r="6" fill="#546e7a"/>
  </g>

  <!-- compressor with a pumping piston -->
  <rect x="318" y="84" width="48" height="66" rx="9" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <rect x="328" y="96" width="28" height="44" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.5"/>
  <g class="piston">
    <rect x="330" y="122" width="24" height="10" rx="2" fill="#fb8c00"/>
    <rect x="339" y="132" width="6" height="12" fill="#ef6c00"/>
  </g>
  <text x="342" y="164" class="label" text-anchor="middle">compressor</text>

  <!-- hot gas temperature -->
  <text x="388" y="182" class="label">gas</text>
  <text x="388" y="198" class="small" fill="#c62828">52 °C</text>

  <!-- mode badge, electrical and thermal power -->
  <rect class="badge" x="398" y="48" width="54" height="22" rx="11"/>
  <text x="425" y="64" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LOW</text>
  <text x="386" y="92" class="label">electrical</text>
  <text x="386" y="110" class="value">386 W</text>
  <text x="386" y="134" class="label">thermal</text>
  <text x="386" y="152" class="value">2.85 kW</text>


  <!-- supply: pond -> pump -> water in -> heat exchanger -->
  <path class="pipe" d="M100 380 V312 H230 V236 H252"/>
  <path class="flow cold" d="M100 380 V312 H230 V236 H252"/>
  <!-- return: heat exchanger -> water out -> pond -->
  <path class="pipe" d="M388 236 H410 V312 H540 V380"/>
  <path class="flow warm" d="M388 236 H410 V312 H540 V380"/>
  <polygon points="533,366 547,366 540,380" fill="#ff8a65"/>

  <!-- water in / out values between the pipes, below the housing -->
  <text x="242" y="300" class="label">water in</text>
  <text x="242" y="318" class="value">14.0 °C</text>
  <text x="398" y="300" class="label" text-anchor="end">water out</text>
  <text x="398" y="318" class="value" text-anchor="end">16.0 °C</text>

  <!-- circulation pump: centrifugal pump symbol (circle, triangle pointing in the flow direction) -->
  <g class="pump-running" transform="translate(160 312)">
    <circle class="pumpbody" r="20"/>
    <polygon class="pumptri" points="-11,-15 -11,15 17,0"/>
  </g>
  <text x="160" y="348" class="label" text-anchor="middle">pump · running</text>
  <text x="160" y="364" font-size="13" font-weight="600" fill="#212121" text-anchor="middle">43 % · 103 W</text>

  <!-- legend of the refrigerant lines -->
  <g transform="translate(476 214)" font-size="10" fill="#6b6b6b">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#e53935" stroke-width="3"/><text x="24" y="4">hot gas</text>
    <line x1="0" y1="16" x2="18" y2="16" stroke="#fb8c00" stroke-width="3"/><text x="24" y="20">liquid</text>
    <line x1="0" y1="32" x2="18" y2="32" stroke="#7e57c2" stroke-width="3"/><text x="24" y="36">suction gas</text>
  </g>

  <!-- pond as a tub of water -->
  <path d="M60 380 H580 V450 Q580 460 570 460 H70 Q60 460 60 450 Z" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <path d="M62 394 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t36 0 V458 H62 Z" fill="#90caf9" opacity=".8"/>
  <text x="320" y="438" class="label" text-anchor="middle">pond</text>
  <text x="320" y="422" font-size="22" font-weight="700" fill="#0d47a1" text-anchor="middle">14.6 °C</text>
</svg>

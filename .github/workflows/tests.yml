name: Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: "pip install --only-binary :all: --require-hashes -r requirements/test.txt"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  home-assistant:
    name: home-assistant (${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: ha-min
            requirements: requirements/minimum/ha-min.txt
          - ha: ha-latest
            requirements: requirements/ha-latest.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # Home Assistant depends on packages that are only published as sdists, so --only-binary is not possible.
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - run: pytest tests_ha -p no:cacheprovider -o pythonpath=. -o testpaths=tests_ha -o asyncio_mode=auto

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json
      - run: npm ci --ignore-scripts --prefix scripts/mermaid
      - run: node scripts/mermaid/check_mermaid.mjs docs/*.md docs/design/*.md

  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:size
      - name: Built bundle matches the sources
        run: git diff --exit-code -- ../custom_components/pond_heatpump_price_planner/frontend/
